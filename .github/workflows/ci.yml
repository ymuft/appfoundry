name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: Configuration sanity check
        run: APP_ENV=local php scripts/check-config.php
      - name: Lint
        run: composer lint
      - name: Tests
        run: composer test
      - name: Build Docker image
        run: docker build --tag appfoundry:ci .

  mysql-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: appfoundry
          MYSQL_ROOT_PASSWORD: appfoundry-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pappfoundry-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_SECURE_COOKIES: 'false'
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: appfoundry
      DB_USERNAME: root
      DB_PASSWORD: appfoundry-root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: Run MySQL migration
        run: php scripts/migrate.php
      - name: Create MySQL admin
        run: php scripts/create-admin.php --name="CI Admin" --email="ci@example.com" --password="correct-horse-battery-staple"
